<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IST AI Chatbot Demo - Live Website Integration</title>
    <link rel="stylesheet" href="assets/css/chatbot.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        /* Demo Banner */
        .demo-banner {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #333;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            font-size: 14px;
        }

        .demo-banner .highlight {
            color: #b92c2c;
            font-weight: 700;
        }

        .demo-banner .close-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #b92c2c;
        }

        /* Website Container */
        .website-container {
            width: 100%;
            height: 100vh;
            position: relative;
            margin-top: 40px; /* Space for demo banner */
        }

        .website-container.banner-hidden {
            margin-top: 0;
        }

        /* IST Website Iframe */
        .ist-website-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #b92c2c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        /* API Status Indicator */
        .api-status {
            position: fixed;
            top: 50px;
            right: 15px;
            padding: 12px 15px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-size: 12px;
            z-index: 9998;
            min-width: 220px;
            transition: all 0.3s ease;
        }

        .api-status.connected {
            border-left: 4px solid #28a745;
        }

        .api-status.disconnected {
            border-left: 4px solid #dc3545;
        }

        .api-status.hidden {
            transform: translateX(100%);
            opacity: 0;
        }

        /* Enhanced Chatbot Toggle Button - Restored Original Design */
        .ist-chatbot-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: linear-gradient(135deg, #e67c1e 0%, #b92c2c 100%);
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            cursor: pointer;
            outline: none;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(185, 44, 44, 0.3);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .ist-chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(185, 44, 44, 0.4);
        }

        .ist-chatbot-toggle img {
            width: 48px;
            height: 48px;
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0;
            pointer-events: none;
        }

        /* Pulse animation for chatbot button */
        @keyframes pulse {
            0% {
                box-shadow: 0 8px 25px rgba(185, 44, 44, 0.4);
            }
            50% {
                box-shadow: 0 8px 25px rgba(185, 44, 44, 0.8);
            }
            100% {
                box-shadow: 0 8px 25px rgba(185, 44, 44, 0.4);
            }
        }

        /* Chatbot Introduction Tooltip */
        .chatbot-intro {
            position: fixed;
            bottom: 100px;
            right: 25px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            max-width: 250px;
            font-size: 14px;
            line-height: 1.4;
            border: 1px solid #e0e0e0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .chatbot-intro.show {
            opacity: 1;
            transform: translateY(0);
        }

        .chatbot-intro::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 30px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
        }

        .chatbot-intro-header {
            color: #b92c2c;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .chatbot-intro-text {
            color: #666;
            margin-bottom: 10px;
        }

        .chatbot-intro-close {
            background: #b92c2c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            float: right;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .demo-banner {
                font-size: 12px;
                padding: 8px 15px;
            }

            .website-container {
                margin-top: 35px;
            }

            .api-status {
                top: 40px;
                right: 10px;
                min-width: 180px;
                font-size: 11px;
                padding: 10px 12px;
            }

            .chatbot-intro {
                right: 15px;
                bottom: 90px;
                max-width: 200px;
                font-size: 13px;
            }

            .ist-chatbot-toggle {
                width: 50px;
                height: 50px;
                bottom: 20px;
                right: 20px;
            }

            .ist-chatbot-toggle img {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Banner -->
    <div id="demo-banner" class="demo-banner">
        🤖 <span class="highlight">AI Chatbot Demo</span> - This is the real IST website with our chatbot integrated! Try clicking the chat button →
        <button class="close-btn" onclick="hideDemoBanner()" title="Hide banner">&times;</button>
    </div>

    <!-- API Status -->
    <div id="api-status" class="api-status">
        <span>🔄 Checking AI chatbot status...</span>
    </div>

    <!-- Website Container -->
    <div id="website-container" class="website-container">
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading IST website...</div>
        </div>

        <!-- IST Website Iframe -->
        <iframe 
            id="ist-website" 
            class="ist-website-frame" 
            src="https://ist.edu.bd/"
            title="Institute of Science and Technology Website"
            onload="hideLoading()"
            onerror="showError()">
        </iframe>
    </div>

    <!-- Chatbot Introduction Tooltip -->
    <div id="chatbot-intro" class="chatbot-intro">
        <div class="chatbot-intro-header">🤖 Try Our AI Assistant!</div>
        <div class="chatbot-intro-text">Ask me anything about IST programs, admissions, or facilities.</div>
        <button class="chatbot-intro-close" onclick="hideChatbotIntro()">Got it!</button>
    </div>

    <!-- Chatbot JavaScript -->
    <script src="assets/js/chatbot.js"></script>
    
    <!-- Demo Scripts -->
    <script>
        // Hide loading overlay when iframe loads
        function hideLoading() {
            const loadingOverlay = document.getElementById('loading-overlay');
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 1000); // Small delay for better UX
        }

        // Show error if iframe fails to load
        function showError() {
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.innerHTML = `
                <div style="text-align: center; color: #b92c2c;">
                    <h3>⚠️ Unable to load IST website</h3>
                    <p>The website might be temporarily unavailable or blocking iframe embedding.</p>
                    <p><a href="https://ist.edu.bd" target="_blank" style="color: #e67c1e;">Visit IST Website Directly →</a></p>
                    <p><small>The chatbot is still available for testing!</small></p>
                </div>
            `;
        }

        // Hide demo banner
        function hideDemoBanner() {
            const banner = document.getElementById('demo-banner');
            const container = document.getElementById('website-container');
            banner.style.display = 'none';
            container.classList.add('banner-hidden');
        }

        // Show chatbot introduction tooltip
        function showChatbotIntro() {
            const intro = document.getElementById('chatbot-intro');
            setTimeout(() => {
                intro.classList.add('show');
            }, 3000); // Show after 3 seconds
        }

        // Hide chatbot introduction tooltip
        function hideChatbotIntro() {
            const intro = document.getElementById('chatbot-intro');
            intro.classList.remove('show');
        }

        // API Status Check
        async function checkAPIStatus() {
            const statusElement = document.getElementById('api-status');

            try {
                const response = await fetch('http://localhost:8001/health');
                if (response.ok) {
                    const data = await response.json();
                    statusElement.className = 'api-status connected';
                    statusElement.innerHTML = `
                        <strong>✅ AI Chatbot Online</strong><br>
                        Knowledge Base: ${data.documents_count} documents<br>
                        <small>Click the chat button to start!</small>
                    `;
                } else {
                    throw new Error('API responded with error');
                }
            } catch (error) {
                statusElement.className = 'api-status disconnected';
                statusElement.innerHTML = `
                    <strong>❌ AI Chatbot Offline</strong><br>
                    Service temporarily unavailable<br>
                    <small>Please start the API server</small>
                `;
            }
        }

        // Toggle API status visibility
        function toggleAPIStatus() {
            const apiStatus = document.getElementById('api-status');
            apiStatus.classList.toggle('hidden');
        }

        // Initialize demo
        window.addEventListener('load', function() {
            // Check API status immediately and then every 30 seconds
            checkAPIStatus();
            setInterval(checkAPIStatus, 30000);
            
            // Show chatbot introduction after page loads
            showChatbotIntro();
            
            // Auto-hide chatbot intro after 15 seconds
            setTimeout(hideChatbotIntro, 18000);
            
            // Hide API status after 10 seconds unless chatbot is offline
            setTimeout(() => {
                const apiStatus = document.getElementById('api-status');
                if (apiStatus.classList.contains('connected')) {
                    toggleAPIStatus();
                }
            }, 10000);

            console.log('🤖 IST AI Chatbot Demo loaded successfully!');
            console.log('💬 Click the chat button to test the AI assistant.');
        });

        // Handle iframe communication (if needed)
        window.addEventListener('message', function(event) {
            // Handle any messages from the embedded website
            console.log('Message from embedded website:', event.data);
        });

        // Prevent right-click on iframe (optional security)
        document.getElementById('ist-website').addEventListener('contextmenu', function(e) {
            // Uncomment the next line if you want to disable right-click
            // e.preventDefault();
        });
    </script>
</body>
</html>
